<!doctype html>
<html>
  <head>
    <title>Casual Enjoyer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.steampowered.com; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'; navigate-to 'self' https: steam:; upgrade-insecure-requests">
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="window-bar">
      <div class="window-bar-left">
        <button
          class="tutorial-btn-help"
          id="language-btn"
          data-i18n="common.languageSwitchTitle"
          data-i18n-attr="title"
        >EN</button>
      </div>
      <span class="window-bar-title" data-i18n="common.appTitle" data-i18n-attr="text">Casual Enjoyer</span>
      <div class="window-bar-btns">
        <button
          class="tutorial-btn-help"
          id="tutorial-btn"
          data-i18n="common.showTutorialTitle"
          data-i18n-attr="title"
        >
          <img
            src="assets/icons-svg/help_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg"
            alt="?"
            class="icon-16"
          />
          <span data-i18n="common.tutorial" data-i18n-attr="text">Tutorial</span>
        </button>
        <button
          class="window-btn minimize"
          id="window-minimize"
          data-i18n="common.minimize"
          data-i18n-attr="title"
          >
          <img
            src="assets/icons-svg/minimize_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg"
            alt="−"
            class="icon-16"
          />
        </button>
        <button
          class="window-btn close"
          id="window-close"
          data-i18n="common.close"
          data-i18n-attr="title"
        >
          <img
            src="assets/icons-svg/close_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg"
            alt="×"
            class="icon-16"
          />
        </button>
      </div>
    </div>
    <div class="main-content">
      <div class="app-viewport">
        <div class="container">
          <div id="notifications" class="mb-sm"></div>
          <h1 class="hidden" data-i18n="index.hiddenH1Title" data-i18n-attr="text">CS2 Casual Enjoyer</h1>

          <!-- Who is signed in; the credential fields open from here -->
          <div id="account-bar" class="account-bar hidden">
            <span id="account-avatar" class="account-avatar" aria-hidden="true"></span>
            <div class="account-who">
              <span id="account-name" class="account-name"></span>
              <span id="account-status" class="account-status" data-state="ok"></span>
            </div>
            <button
              id="refresh-friends-btn"
              class="icon-btn"
              data-i18n="account.refreshTitle"
              data-i18n-attr="title"
            >
              <img
                src="assets/icons-svg/refresh_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg"
                alt="↻"
                class="icon-16"
              />
            </button>
            <button id="account-edit-btn" class="ghost-btn" data-i18n="account.edit" data-i18n-attr="text">Account</button>
          </div>

          <!-- Credentials, step by step: open while the app cannot work yet -->
          <div id="account-panel" class="account-panel">
            <div class="account-panel-head">
              <div>
                <h2 class="account-panel-title" data-i18n="account.panelTitle" data-i18n-attr="text">Connect to Steam</h2>
                <p class="account-panel-intro" data-i18n="account.panelIntro" data-i18n-attr="text"></p>
              </div>
              <button id="account-close-btn" class="ghost-btn hidden" data-i18n="account.close" data-i18n-attr="text">Close</button>
            </div>
            <ol class="account-steps">
              <li class="account-step">
                <span class="step-num">1</span>
                <div class="step-body">
                  <span class="step-title" data-i18n="account.step1" data-i18n-attr="text"></span>
                  <div class="step-row">
                    <a
                      id="token-page-btn"
                      class="action-btn"
                      href="steam://openurl/https://store.steampowered.com/pointssummary/ajaxgetasyncconfig"
                      target="_self"
                      data-i18n="account.openInSteam"
                      data-i18n-attr="text"
                    >Open in Steam ↗</a>
                    <span class="step-hint" data-i18n="account.step1Hint" data-i18n-attr="text"></span>
                  </div>
                </div>
              </li>
              <li class="account-step">
                <span class="step-num">2</span>
                <div class="step-body">
                  <span class="step-title" data-i18n="account.step2" data-i18n-attr="text"></span>
                  <span class="step-hint" data-i18n="account.step2Hint" data-i18n-attr="text"></span>
                  <input id="auth" type="password" autocomplete="off" spellcheck="false" />
                </div>
              </li>
              <li class="account-step">
                <span id="steamid-step-num" class="step-num">3</span>
                <div class="step-body">
                  <span id="steamid-step-title" class="step-title"></span>
                  <div id="steamid-input-row" class="step-row hidden">
                    <input id="steam-id" autocomplete="off" spellcheck="false" placeholder="SteamID64" />
                    <a
                      id="steam-id-help"
                      href="steam://url/SteamIDMyProfile"
                      target="_self"
                      class="step-link"
                      data-i18n="index.steamId64Title"
                      data-i18n-attr="title"
                      data-i18n-second="index.steamId64Label"
                      data-i18n-attr-second="text"
                    >SteamID64</a>
                  </div>
                </div>
              </li>
            </ol>
            <div class="account-panel-foot">
              <a id="api-key-help" href="#" class="step-link" data-i18n="account.help" data-i18n-attr="text">Token or API key: how to get one</a>
              <button
                id="update-friends-btn"
                class="action-btn"
                data-i18n="index.updateFriendsButtonTitle"
                data-i18n-attr="title"
                data-i18n-second="index.updateFriendsButton"
                data-i18n-attr-second="text"
              >Load friends</button>
            </div>
          </div>

          <!-- The running join attempt, whatever tab it started from -->
          <div id="join-bar" class="join-bar hidden" role="status" aria-live="polite">
            <span class="join-bar-spinner" aria-hidden="true"></span>
            <div class="join-bar-text">
              <span id="join-bar-title" class="join-bar-title"></span>
              <span id="join-bar-detail" class="join-bar-detail"></span>
            </div>
            <button id="join-bar-cancel" class="action-btn cancel-btn"></button>
          </div>

          <div class="view-tabs" id="view-tabs" role="tablist">
            <button class="view-tab active" data-view="friends" role="tab" aria-selected="true">
              <span data-i18n="views.friends" data-i18n-attr="text">Friends</span>
              <span id="tab-count-friends" class="tab-count"></span>
            </button>
            <button class="view-tab" data-view="fake" role="tab" aria-selected="false">
              <span data-i18n="views.fakeFriends" data-i18n-attr="text">Fake Friends</span>
              <span id="tab-count-fake" class="tab-count"></span>
            </button>
            <button class="view-tab" data-view="maps" role="tab" aria-selected="false">
              <span data-i18n="views.maps" data-i18n-attr="text">Maps</span>
              <span id="tab-count-maps" class="tab-count"></span>
            </button>
            <div class="view-tools">
              <input
                id="friend-filter-input"
                class="view-tool"
                data-tool-for="friends"
                type="text"
                data-i18n="index.friendFilterPlaceholder"
                data-i18n-attr="placeholder"
                placeholder=""
              />
              <span id="map-finder-status" class="view-tool map-finder-status hidden" data-tool-for="maps"></span>
            </div>
          </div>
          <div
            id="cs2-launch-notification"
            class="cs2-launch-overlay hidden"
          ></div>
          <div id="friends-view" class="app-view">
            <div class="friend-list" id="friends"></div>
            <div id="friends-empty" class="view-empty hidden" data-i18n="views.friendsEmpty" data-i18n-attr="text"></div>
          </div>
          <div id="fake-view" class="app-view hidden">
            <div id="fake-friend-section" class="fake-friend-add">
              <div class="fake-friend-add-header">
                <h3 data-i18n="friends.addFakeFriend">Add Fake Friend</h3>
              </div>
              <div class="fake-friend-add-content">
                <div class="fake-friend-input-wrapper">
                  <input
                    id="fake-friend-steamid"
                    type="text"
                    data-i18n="friends.fakeFriendSteamIdPlaceholder"
                    data-i18n-attr="placeholder"
                    placeholder=""
                  />
                  <div
                    id="fake-friend-error"
                    class="error-message hidden"
                  ></div>
                </div>
                <button
                  id="add-fake-friend-btn"
                  class="action-btn"
                  data-i18n="friends.addButton"
                  data-i18n-attr="text"
                >
                  Add
                </button>
              </div>
            </div>
            <div class="friend-list" id="fake-friends"></div>
            <div id="fake-friends-empty" class="view-empty" data-i18n="views.fakeFriendsEmpty" data-i18n-attr="text">No Fake Friends yet.</div>
          </div>
          <div id="maps-view" class="app-view hidden">
            <div class="friend-list" id="maps-list"></div>
            <div id="maps-empty" class="view-empty hidden"></div>
            <div class="fof-key" id="fof-key-section">
              <div class="fof-line">
                <span id="fof-summary" class="fof-summary"></span>
                <button id="fof-key-toggle" class="link-btn"></button>
              </div>
              <div id="fof-key-details" class="fof-key-details hidden">
                <div class="fof-key-row" id="fof-key-row">
                  <input
                    id="fof-key-input"
                    type="password"
                    autocomplete="off"
                    data-i18n="mapFinder.fofKeyPlaceholder"
                    data-i18n-attr="placeholder"
                    placeholder=""
                  />
                  <button id="fof-key-save" class="action-btn" data-i18n="mapFinder.fofKeySave" data-i18n-attr="text">Save</button>
                  <button id="fof-key-delete" class="action-btn cancel-btn hidden" data-i18n="mapFinder.fofKeyDelete" data-i18n-attr="text">Delete key</button>
                </div>
                <div id="fof-key-hint" class="map-finder-hint"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="custom-footer-bar">
      <span id="gsi-status" class="gsi-status" data-state="waiting">
        <span class="gsi-status-dot"></span>
        <span id="gsi-status-label" class="gsi-status-label">GSI</span>
      </span>
      <span class="footer-app-title">
        <span id="app-version"></span>
        <span class="footer-author-info">
          <a
            href="steam://openurl/https://steamcommunity.com/id/skik4"
            class="footer-social-link"
            data-i18n="index.footerSteamProfileTitle"
            data-i18n-attr="title"
          >
            <img
              src="assets/logo-svg/steam-white.svg"
              alt="Steam"
              class="footer-social-icon"
            />
          </a>
          <a
            href="https://github.com/skik4"
            class="footer-social-link"
            data-i18n="index.footerGithubProfileTitle"
            data-i18n-attr="title"
            target="_blank"
          >
            <img
              src="assets/logo-svg/github-mark-white.svg"
              alt="GitHub"
              class="footer-social-icon"
            />
          </a>
        </span>
      </span>
    </div>
    <script type="module" src="src/core/app.js"></script>
  </body>
</html>
